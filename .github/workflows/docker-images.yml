name: Docker images

# Builds the api and web images and pushes them to the GitHub Container Registry
# as ghcr.io/<owner>/searchlight-api and ghcr.io/<owner>/searchlight-web, tagged
# sha-<short commit> (every push to main or manual run) and latest (main).
# The VPS pulls them instead of building on the box: see infra/deploy-vps.sh and
# DEPLOY.md. Pull requests only build, to catch a broken image before it
# reaches main.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# A newer push to a PR supersedes its running build; main builds all finish,
# so every main commit keeps an image to deploy or roll back to.
concurrency:
    group: docker-images-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: ${{ matrix.image }}
        # The VPS is arm64: build natively on an arm64 runner rather than under
        # QEMU emulation.
        runs-on: ubuntu-24.04-arm
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: api
                    - image: web
                      # Baked into the static bundle, so this image only talks to
                      # the VPS API. Keep in step with docker-compose.vps.yml.
                      build-args: PUBLIC_API_BASE=https://api-searchlight.jetlageuropa.org
        steps:
            - uses: actions/checkout@v6

            - uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/searchlight-${{ matrix.image }}
                  tags: |
                      type=sha
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/${{ matrix.image }}/Dockerfile
                  platforms: linux/arm64
                  build-args: ${{ matrix.build-args }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
