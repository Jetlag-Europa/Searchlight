# Overlay: API and Postgres only, with the API published on the host for a
# reverse proxy or tunnel you run yourself. The web app is hosted elsewhere
# (Cloudflare, via wrangler.json; see DEPLOY.md).
services:
  api:
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3000}:3000"

  web:
    # Not started by `docker compose up`.
    profiles: [web]
