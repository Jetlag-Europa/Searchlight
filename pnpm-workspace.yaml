packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@vaadin/vaadin-usage-statistics": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true

# Security fixes for Prisma's config loader that no Prisma 6 release picks up.
# @prisma/config 6.19 pins deepmerge-ts@7.1.5 (fixed in 8.0.0,
# GHSA-ggr8-5vv4-36mx) and c12@3.1.0, whose defu range still admits the
# vulnerable 6.1.4 (GHSA-737v-mqg7-c878). Prisma 7 is a larger migration;
# drop these once we're on it.
overrides:
  "defu@<6.1.5": ^6.1.5
  "deepmerge-ts@<8.0.0": ^8.0.0
