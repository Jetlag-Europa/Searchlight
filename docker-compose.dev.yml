# Dev stack port overrides — used on the server alongside production.
# Do NOT use this file locally; docker-compose.override.yml handles local dev.
#
# Launch with: infra/deploy-dev.sh
# Or manually:
#   docker compose -p writemap-dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  api:
    ports:
      - "3100:3000"

  web:
    ports:
      - "8180:80"
