# Production server ports — used by infra/deploy-prod.sh
services:
  postgres:
    ports:
      - "127.0.0.1:5435:5432"

  api:
    ports:
      - "3000:3000"
    env_file: .env.prod

  web:
    ports:
      - "8080:80"
    build:
      args:
        PUBLIC_API_BASE: https://apihideandseek.lucifersserver.com
