# Stub Overpass for the searchlight-test stack. Any request returns a valid but
# empty Overpass JSON payload, so boundary/POI questions resolve deterministically
# and offline (no public or self-hosted Overpass).
server {
    listen 80;
    location / {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"version":0.6,"generator":"overpass-stub","elements":[]}';
    }
}
