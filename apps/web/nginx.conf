# Link-preview bots (Discord, Slack, ...) read a page's Open Graph tags without
# running its scripts, so /play would show them only the site-wide ones. Their
# requests go to the API's preview page instead: the game's name and its map.
# Each pattern is the fetcher's own User-Agent, not just the app's name, so
# the apps' in-app browsers still get the app: WhatsApp's fetcher sends
# "WhatsApp/2.x A" (and Signal's "WhatsApp/2"), Mastodon's "Mastodon/4.x" or
# "(Mastodon/4.x; ...)", Matrix's "Synapse (bot; ...)" ("Synapse/1.x" before
# 1.54). Viber's Android app sends its in-app browser's User-Agent for both,
# so that browser gets the preview page, which links to the app's page.
map $http_user_agent $link_preview_bot {
    default 0;
    "~*(Discordbot|Twitterbot|facebookexternalhit|Facebot|Slackbot|TelegramBot|^WhatsApp/|LinkedInBot|Mastodon/|Cardyb|SkypeUriPreview|redditbot|Embedly|Iframely|Synapse \(bot|^Synapse/|ZulipURLPreview|SummalyBot|Viber)" 1;
}

server {
    listen 80;
    server_name _;

    # The API, as the compose files name it. Resolved per request through
    # Docker's DNS, so nginx starts even where there is no API container;
    # the previews then fall back to the plain page.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:3000;

    # Emit relative redirects (Location: /map/ not http://host:80/map/). nginx
    # only knows its internal listen port, so absolute redirects drop the real
    # published port behind a port mapping/proxy (e.g. the searchlight-test stack on
    # :8280), sending the browser to a dead portless URL. Relative is proxy-safe
    # everywhere — prod sits behind Cloudflare at standard ports regardless.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/geo+json application/manifest+json application/javascript application/xml+rss application/atom+xml image/svg+xml application/wasm;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Hashed assets — immutable cache (Vite/Astro output under /_astro/)
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # PWA service worker — must always revalidate so updates activate promptly
    location ~* ^/(sw\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # PWA web app manifest (nginx's mime.types doesn't know the extension)
    location ~* \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # HTML pages — no cache so users always get the latest shell
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # A game link (/play?token=…): its preview page for link-preview bots,
    # the app's page for everyone else.
    location ~ ^/play/?$ {
        if ($link_preview_bot) {
            rewrite ^ /og/play last;
        }
        add_header Cache-Control "no-cache";
        add_header Vary "User-Agent";
        include /etc/nginx/security-headers.conf;
        try_files /play/index.html =404;
    }

    # Link previews (apps/api/src/routes/og.ts). Only these two paths reach
    # the API, each as a fixed path, and unfurlers wait a few seconds at most:
    # if the API is slow, answers with an error or can't be reached, the
    # preview page falls back to the app's page and its site-wide tags. With
    # one API container that takes at most 4 s: 1 s to resolve its name, 1 s
    # to connect and 2 s for its answer. A hung API takes the 2 s; a stopped
    # one takes the 1 s to connect while nginx still has its address cached
    # (up to 10 s), then none. nginx tries each container in turn if there
    # are several.
    location = /og/play {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/og/play$is_args$args;
        resolver_timeout 1s;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        # Every registered 4xx and 5xx status, such as the 404 from an API
        # older than these routes, except the 408 and 413 nginx gives for a
        # request body that is too slow or too large.
        error_page 400 401 402 403 404 405 406 407 409 410 411 412 414 415 416
                   417 418 421 422 423 424 425 426 428 429 431 451
                   500 501 502 503 504 505 506 507 508 510 511 = @play_page;
        add_header Vary "User-Agent";
        include /etc/nginx/security-headers.conf;
    }

    location @play_page {
        # The error pages above include the 403 that limit_except gives other
        # methods: this keeps them a 403, as for the rest of /og/.
        limit_except GET { deny all; }
        add_header Cache-Control "no-cache";
        add_header Vary "User-Agent";
        include /etc/nginx/security-headers.conf;
        try_files /play/index.html =404;
    }

    location ^~ /og/ {
        location ~ ^/og/game-links/([0-9a-f]+)/map\.png$ {
            limit_except GET { deny all; }
            proxy_pass $api_upstream/og/game-links/$1/map.png$is_args$args;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            include /etc/nginx/security-headers.conf;
        }
        return 404;
    }

    # Cloudflare's header rules (public/_headers), not a page
    location = /_headers {
        return 404;
    }

    # SPA fallback — non-asset paths resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
