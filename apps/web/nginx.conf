server {
    listen 80;
    server_name _;

    # Emit relative redirects (Location: /map/ not http://host:80/map/). nginx
    # only knows its internal listen port, so absolute redirects drop the real
    # published port behind a port mapping/proxy (e.g. the writemap-test stack on
    # :8280), sending the browser to a dead portless URL. Relative is proxy-safe
    # everywhere — prod sits behind Cloudflare/NPM at standard ports regardless.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Legacy TaibledOG path — redirect everything under /JetLagHideAndSeek to root.
    # Chrome caches this path from the old GitHub Pages deployment.
    location ^~ /JetLagHideAndSeek {
        return 301 /;
    }

    # Hashed assets — immutable cache (Vite/Astro output under /_astro/)
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA service worker — must always revalidate so updates activate promptly
    location ~* ^/(sw\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA web app manifest
    location ~* \.webmanifest$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML pages — no cache so users always get the latest shell
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Game assets (KML, GeoJSON) — always revalidate so deploys with new/updated
    # game files are picked up immediately without users needing a hard reload.
    location ~* \.(kml|geojson)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — non-asset paths resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
