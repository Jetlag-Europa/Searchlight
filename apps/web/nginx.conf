server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets — immutable cache (Vite/Astro output under /_astro/)
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA service worker — must always revalidate so updates activate promptly
    location ~* ^/(sw\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA web app manifest
    location ~* \.webmanifest$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML pages — no cache so users always get the latest shell
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — non-asset paths resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
