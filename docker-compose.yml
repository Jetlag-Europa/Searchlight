# The Searchlight stack: Postgres, the API and the web app (nginx serving the
# static build). Nothing is published on the host; an overlay adds the way in:
#
#   docker-compose.cloudflared.yml  Cloudflare Tunnel to web and api (production)
#   docker-compose.backend.yml      API on a host port, no web container
#   docker-compose.test.yml         e2e test stack (infra/deploy-test.sh)
#
# A server picks its overlay with COMPOSE_FILE in .env (.env.prod.example), so
# plain `docker compose ...` commands work there. Deploy with infra/deploy.sh.
#
# api and web are the images CI pushes to GHCR (.github/workflows/docker-images.yml).
# `docker compose pull` fetches them; `docker compose build` builds the same
# names from this checkout instead.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: taibled
      POSTGRES_USER: ${POSTGRES_USER:-taibled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taibled} -d taibled"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    image: ghcr.io/jetlag-europa/searchlight-api:${SEARCHLIGHT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Built from the Postgres settings, so .env's DATABASE_URL (the one for
      # running the API on the host) never applies inside Docker.
      DATABASE_URL: postgresql://${POSTGRES_USER:-taibled}:${POSTGRES_PASSWORD}@postgres:5432/taibled
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  web:
    image: ghcr.io/jetlag-europa/searchlight-web:${SEARCHLIGHT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the static bundle. CI builds with the same default.
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api-searchlight.jetlageuropa.org}
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
