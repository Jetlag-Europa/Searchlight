# Overlay: the isolated e2e test stack (project `searchlight-test`), brought up
# and seeded by infra/deploy-test.sh. The API allows test logins
# (ENABLE_TEST_AUTH) and the web build exposes window.__searchlight.
#
# Ports, all on 127.0.0.1: web 8280, api 3200, postgres 5435. Use 127.0.0.1,
# not localhost: Chromium resolves localhost to ::1, where nothing listens.
services:
  postgres:
    ports:
      - "127.0.0.1:5435:5432"

  api:
    image: searchlight-test-api
    environment:
      NODE_ENV: development
      ENABLE_TEST_AUTH: "1"
      FRONTEND_ORIGIN: http://127.0.0.1:8280
      DISCORD_REDIRECT_URI: http://127.0.0.1:3200/auth/discord/callback
    ports:
      - "127.0.0.1:3200:3000"

  web:
    image: searchlight-test-web
    build:
      args:
        PUBLIC_API_BASE: http://127.0.0.1:3200
        PUBLIC_ENABLE_TEST_HOOK: "1"
    ports:
      - "127.0.0.1:8280:80"
